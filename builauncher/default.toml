# Copy to ~/.config/builauncher/menu.toml and edit.
# An item has one of: `exec` (a command), 1 to 8 `[[...item]]` children (a sub-pie),
# or `places = true` (a sub-pie of home, documents, downloads, ... and the trash).
# `icon` is a Blender icon name (CONSOLE, FILE_FOLDER, PLAY, ...).
apps = true  # also search installed .desktop apps
# global shortcut, asked of the desktop at the first daemon start (XDG GlobalShortcuts portal).
# after that, change it in the desktop's shortcut settings.
shortcut = "CTRL+ALT+space"
scale = 1.0  # size of the pie and the search (BUI ui scale)

[[item]]
name = "Terminal"
icon = "CONSOLE"
exec = "konsole"

[[item]]
name = "Browser"
icon = "WORLD"
exec = "xdg-open https://"

[[item]]
name = "Files"
icon = "FILE_FOLDER"
places = true

[[item]]
name = "Media"
icon = "SOUND"
  [[item.item]]
  name = "Play / Pause"
  icon = "PLAY"
  exec = "playerctl play-pause"
  [[item.item]]
  name = "Next"
  icon = "FF"
  exec = "playerctl next"
  [[item.item]]
  name = "Previous"
  icon = "REW"
  exec = "playerctl previous"

[[item]]
name = "System"
icon = "PREFERENCES"
  [[item.item]]
  name = "Lock"
  icon = "LOCKED"
  exec = "loginctl lock-session"
  [[item.item]]
  name = "Suspend"
  icon = "SORTTIME"
  exec = "systemctl suspend"
  [[item.item]]
  name = "Power"
  icon = "QUIT"
    [[item.item.item]]
    name = "Reboot"
    icon = "FILE_REFRESH"
    exec = "systemctl reboot"
    [[item.item.item]]
    name = "Shut down"
    icon = "QUIT"
    exec = "systemctl poweroff"
