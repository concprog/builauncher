# Copy to ~/.config/buiemenu/menu.toml and edit.
# An item has either `exec` (a command) or `[[...item]]` children (a submenu).
# `icon` is a freedesktop icon theme name.
apps = true  # also search installed .desktop apps

[theme]
accent = "#89b4fa"
radius = 130

[[item]]
name = "Terminal"
icon = "utilities-terminal"
exec = "konsole"

[[item]]
name = "Browser"
icon = "web-browser"
exec = "xdg-open https://"

[[item]]
name = "Files"
icon = "system-file-manager"
exec = "xdg-open ."

[[item]]
name = "Media"
icon = "applications-multimedia"
  [[item.item]]
  name = "Play / Pause"
  icon = "media-playback-start"
  exec = "playerctl play-pause"
  [[item.item]]
  name = "Next"
  icon = "media-skip-forward"
  exec = "playerctl next"
  [[item.item]]
  name = "Previous"
  icon = "media-skip-backward"
  exec = "playerctl previous"

[[item]]
name = "System"
icon = "preferences-system"
  [[item.item]]
  name = "Lock"
  icon = "system-lock-screen"
  exec = "loginctl lock-session"
  [[item.item]]
  name = "Suspend"
  icon = "system-suspend"
  exec = "systemctl suspend"
  [[item.item]]
  name = "Power"
  icon = "system-shutdown"
    [[item.item.item]]
    name = "Reboot"
    icon = "system-reboot"
    exec = "systemctl reboot"
    [[item.item.item]]
    name = "Shut down"
    icon = "system-shutdown"
    exec = "systemctl poweroff"
