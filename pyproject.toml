[project]
name = "builauncher"
version = "0.1.0"
description = "Pie-menu launcher with type-to-search, on BUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blenderui>=0.4.1",
    "numpy",
    "rapidfuzz>=3",
    "jeepney>=0.8; sys_platform == 'linux'",
    "PySide6>=6.6",
]

[project.scripts]
builauncher = "builauncher.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
