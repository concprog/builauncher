[project]
name = "buiemenu"
version = "0.1.0"
description = "Pie-menu launcher with flick gestures and type-to-search"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.scripts]
buiemenu = "buiemenu.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
buiemenu = ["default.toml", "qml/*.qml"]
