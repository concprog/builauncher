[project]
name = "builauncher"
version = "0.1.0"
description = "Pie-menu launcher with type-to-search, on BUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blenderui>=0.4.1",
    "numpy",
    "rapidfuzz>=3",
    "PySide6>=6.6; sys_platform == 'win32'",  # Linux: the distro's python3-pyside6
]

[project.optional-dependencies]
# Linux: Qt and GObject bindings from PyPI; distro packages (python3-pyside6, python3-gobject) do the same
wheels = ["PySide6>=6.6", "PyGObject; sys_platform == 'linux'"]

[project.scripts]
builauncher = "builauncher.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
